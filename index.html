        if (PROFESSIONAL_WORD_IMAGES[mappedWord]) {
          return PROFESSIONAL_WORD_IMAGES[mappedWord];
        }
        const emoji = WORD_EMOJIS[mappedWord] || '🐝';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
          <rect width="100%" height="100%" rx="30" fill="#e0e7ff"/>
          <text x="50%" y="45%" dominant-baseline="central" text-anchor="middle" font-size="90">${emoji}</text>
          <text x="50%" y="78%" dominant-baseline="central" text-anchor="middle" font-size="28" font-family="sans-serif" font-weight="bold" fill="#4338ca">${cleanWord.toUpperCase()}</text>
        </svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
      }

      const getPhonetic = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        if (COMMON_IPA[clean]) return COMMON_IPA[clean];
        try {
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean)}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data[0]) {
              if (data[0].phonetic) return data[0].phonetic;
              if (data[0].phonetics && data[0].phonetics.length > 0) {
                const found = data[0].phonetics.find(p => p.text);
                if (found) return found.text;
              }
            }
          }
        } catch (e) {}
        return `/${clean}/`;
      };

      const getSentence = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        if (COMMON_SENTENCES[clean]) return COMMON_SENTENCES[clean];
        return `The word "${wordText}" is fun to spell!`;
      };

      const getImage = async (wordText) => {
        const clean = (wordText || '').trim().toLowerCase();
        const mappedWord = clean === 'kife' ? 'knife' : clean === 'drees' ? 'dress' : clean;
        if (PROFESSIONAL_WORD_IMAGES[mappedWord]) {
          return PROFESSIONAL_WORD_IMAGES[mappedWord];
        }
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          const wikiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(mappedWord)}&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
          const response = await fetch(wikiUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (response.ok) {
            const data = await response.json();
            if (data && data.query && data.query.pages) {
              const pages = Object.values(data.query.pages);
              if (pages.length > 0 && pages[0].imageinfo && pages[0].imageinfo[0]) {
                const info = pages[0].imageinfo[0];
                const imgUrl = info.thumburl || info.url;
                if (imgUrl && !imgUrl.endsWith('.svg') && !imgUrl.endsWith('.pdf')) {
                  return imgUrl;
                }
              }
            }
          }
        } catch (e) {}

        return createWordSvgIllustration(wordText);
      };

      const pcmToWav = (pcmData, sampleRate = 22050) => {
        const buffer = new ArrayBuffer(44 + pcmData.length);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + pcmData.length, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, pcmData.length, true);
        new Uint8Array(buffer, 44).set(pcmData);
        return new Blob([buffer], { type: 'audio/wav' });
      };

      const downloadZip = async (words, courseName) => {
        if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
        const zip = new JSZip();
        let audioCount = 0;
        for (const word of words) {
          if (word.status === WordStatus.COMPLETED && word.audioData) {
            const fileName = `${word.text.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.wav`;
            zip.file(fileName, word.audioData);
            audioCount++;
          }
        }
        if (audioCount === 0) throw new Error('No audio files to zip.');
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${courseName.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const parseDocx = async (file) => {
        if (typeof mammoth === 'undefined') throw new Error('Mammoth.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        return result.value
          .split(/\r?\n/)
          .map(w => w.trim())
          .filter(w => w && !/\d/.test(w));
      };

      const parseXlsx = async (file) => {
        if (typeof XLSX === 'undefined') throw new Error('XLSX.js not found.');
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        return json
          .flat()
          .map(cell => (cell ? String(cell).trim() : ''))
          .filter(cell => cell && !/\d/.test(cell));
      };

      const parsePdf = async (file) => {
        if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const words = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageWords = textContent.items
            .map(item => ('str' in item ? item.str.trim() : ''))
            .filter(w => w && !/\d/.test(w));
          for (const wordText of pageWords) {
            words.push({
              id: generateUniqueId(wordText),
              text: wordText,
              status: WordStatus.PENDING,
              phonetic: null,
              sentence: null,
              imageUrl: null,
              audioUrl: null,
              audioData: null,
              error: null,
            });
          }
        }
        return words;
      };

      const parseZip = async (file, currentWords) => {
        if (typeof JSZip === 'undefined') throw new Error('JSZip not found.');
        const zip = new JSZip();
        const content = await zip.loadAsync(file);
        const matched = [];
        const unmatched = [];
        for (const [filename, zipEntry] of Object.entries(content.files)) {
          if (!zipEntry.dir && filename.toLowerCase().endsWith('.wav')) {
            const wordName = filename.replace(/\.[^/.]+$/, '').toLowerCase();
            const blob = await zipEntry.async('blob');
            const matchingWord = currentWords.find(w => w.toLowerCase() === wordName);
            if (matchingWord) {
              matched.push({ text: matchingWord, audioBlob: blob });
            } else {
              unmatched.push(wordName);
            }
          }
        }
        return { matched, unmatched };

        );
      };

      const SpinningWheel = ({ words, onClose, background, logo, onOpenSpellingBee, onSpeak, isWhiteBg, setIsWhiteBg, isMuted, setIsMuted, hideLetters, setHideLetters }) => {
        const canvasRef = useRef(null);
        const [selectedWord, setSelectedWord] = useState(null);
        const [isSpinning, setIsSpinning] = useState(false);
        const [showCard, setShowCard] = useState(false);
        const [isSpellingSequence, setIsSpellingSequence] = useState(false);
        const [activeLetterIndex, setActiveLetterIndex] = useState(-1);
        const [isSpeakingWholeWord, setIsSpeakingWholeWord] = useState(false);
        const [canvasSize, setCanvasSize] = useState(500);
        const [removedWordIds, setRemovedWordIds] = useState(new Set());

        // Voice Challenge State & Transcripts
        const [voiceMode, setVoiceMode] = useState('idle'); // 'idle' | 'initial_listen' | 'initial_correct' | 'spelling' | 'final_listen' | 'completed' | 'error'
        const [completedLetterIndices, setCompletedLetterIndices] = useState([]);
        const [isInitialWordCorrect, setIsInitialWordCorrect] = useState(false);
        const [isFinalWordCorrect, setIsFinalWordCorrect] = useState(false);
        const [showRedX, setShowRedX] = useState(false);
        const [voiceInstruction, setVoiceInstruction] = useState('');
        const recognitionRef = useRef(null);

        // Recording & Spoken Transcripts State
        const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
        const [isPlayingRecording, setIsPlayingRecording] = useState(false);
        const [initialWordTranscript, setInitialWordTranscript] = useState('');
        const [spellingLettersTranscript, setSpellingLettersTranscript] = useState([]);
        const [finalWordTranscript, setFinalWordTranscript] = useState('');
        
        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);
        const recordedAudioRef = useRef(null);

        const currentAngleRef = useRef(0);
        const angularVelocityRef = useRef(0);
        const animationFrameRef = useRef(0);
        const loadedImagesRef = useRef({});
        const lastTickSegmentRef = useRef(-1);
        const audioCtxRef = useRef(null);

        // Sound effects for Voice Challenge
        const playErrorTone = useCallback(() => {
          if (isMuted) return;
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.45);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.45);
          } catch (e) {}
        }, [isMuted]);

        const playPositiveChime = useCallback(() => {
          if (isMuted) return;
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } catch (e) {}
        }, [isMuted]);

        const stopAudioRecording = useCallback(() => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            try {
              mediaRecorderRef.current.stop();
            } catch (e) {}
          }
        }, []);

        const triggerVoiceError = useCallback(() => {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
          stopAudioRecording();
          playErrorTone();
          setShowRedX(true);
          setVoiceMode('error');
          setVoiceInstruction('¡Incorrecto!');
          setTimeout(() => {
            setShowRedX(false);
            setVoiceMode('idle');
            setVoiceInstruction('');
          }, 1800);
        }, [playErrorTone, stopAudioRecording]);

        const normalizeLetterToken = (token) => {
          if (!token) return '';
          const clean = token.toLowerCase().trim().replace(/[^a-z0-9]/gi, '');
          const letterMap = {
            'a': 'a', 'ay': 'a', 'ey': 'a', 'ah': 'a', 'ei': 'a', 'hay': 'a',
            'b': 'b', 'be': 'b', 'bee': 'b', 'bi': 'b',
            'c': 'c', 'see': 'c', 'sea': 'c', 'si': 'c',
            'd': 'd', 'dee': 'd', 'di': 'd',
            'e': 'e', 'ee': 'e', 'i': 'e',
            'f': 'f', 'ef': 'f', 'eff': 'f',
            'g': 'g', 'gee': 'g', 'ji': 'g', 'gi': 'g',
            'h': 'h', 'aitch': 'h', 'haitch': 'h', 'eitch': 'h',
            'i': 'i', 'eye': 'i', 'ai': 'i', 'ay': 'i',
            'j': 'j', 'jay': 'j', 'jei': 'j',
            'k': 'k', 'kay': 'k', 'kei': 'k',
            'l': 'l', 'el': 'l', 'ell': 'l',
            'm': 'm', 'em': 'm',
            'n': 'n', 'en': 'n',
            'o': 'o', 'oh': 'o', 'ou': 'o',
            'p': 'p', 'pee': 'p', 'pi': 'p',
            'q': 'q', 'cue': 'q', 'kew': 'q', 'cu': 'q',
            'r': 'r', 'ar': 'r', 'are': 'r', 'er': 'r',
            's': 's', 'es': 's', 'ess': 's',
            't': 't', 'tee': 't', 'tea': 't', 'ti': 't',
            'u': 'u', 'you': 'u', 'yu': 'u',
            'v': 'v', 'vee': 'v', 'vi': 'v',
            'w': 'w', 'double u': 'w', 'doubleyou': 'w',
            'x': 'x', 'ex': 'x',
            'y': 'y', 'why': 'y', 'wai': 'y',
            'z': 'z', 'zed': 'z', 'zee': 'z'
          };
          return letterMap[clean] || (clean.length === 1 ? clean : clean.charAt(0));
        };

        const handleVoiceChallenge = async () => {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            alert('El reconocimiento de voz no está soportado en este navegador. Utiliza Google Chrome o Edge.');
            return;
          }

          if (voiceMode !== 'idle') return;

          // Clean previous recordings & transcripts
          if (recordedAudioUrl) {
            URL.revokeObjectURL(recordedAudioUrl);
            setRecordedAudioUrl(null);
          }
          setInitialWordTranscript('');
          setSpellingLettersTranscript([]);
          setFinalWordTranscript('');
          setIsPlayingRecording(false);

          // Start MediaRecorder Audio Stream
          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              audioChunksRef.current = [];
              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;

              mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                  audioChunksRef.current.push(event.data);
                }
              };

              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                const url = URL.createObjectURL(audioBlob);
                setRecordedAudioUrl(url);
                stream.getTracks().forEach(track => track.stop());
              };

              mediaRecorder.start();
            }
          } catch (err) {
            console.warn('Could not record voice audio:', err);
          }

          const targetWord = selectedWord.text.trim().toLowerCase();
          const wordLength = targetWord.length;
          setVoiceMode('initial_listen');
          setCompletedLetterIndices([]);
          setIsInitialWordCorrect(false);
          setIsFinalWordCorrect(false);
          setVoiceInstruction(`🎤 Paso 1 de 3: Pronuncia la palabra completa "${selectedWord.text.toUpperCase()}"`);

          const isWordMatch = (spoken, target) => {
            if (!spoken || !target) return false;
            const cleanSpoken = spoken.toLowerCase().trim().replace(/[^a-z0-9\s]/gi, '');
            const cleanTarget = target.toLowerCase().trim().replace(/[^a-z0-9]/gi, '');
            if (cleanSpoken === cleanTarget) return true;
            const words = cleanSpoken.split(/\s+/);
            return words.includes(cleanTarget) || cleanSpoken.endsWith(cleanTarget) || cleanSpoken.startsWith(cleanTarget);
          };

          let currentStage = 'initial_listen';
          let letterPointer = 0;

          // Function to restart a clean recognition session per stage
          const startRecognitionForStage = (stage) => {
            if (recognitionRef.current) {
              try { recognitionRef.current.stop(); } catch (e) {}
            }

            const rec = new SpeechRecognition();
            recognitionRef.current = rec;
            rec.continuous = true;
            rec.interimResults = false;
            rec.lang = 'en-US';

            rec.onresult = (event) => {
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                const rawTranscript = res[0].transcript.trim();
                if (!rawTranscript) continue;

                const cleanTranscript = rawTranscript.toLowerCase().replace(/[^a-z0-9\s]/gi, '');

                if (currentStage === 'initial_listen') {
                  // Stage 1: Evaluate ONLY the initial complete word
                  setInitialWordTranscript(rawTranscript);
                  if (isWordMatch(cleanTranscript, targetWord)) {
                    playPositiveChime();
                    setIsInitialWordCorrect(true);
                    currentStage = 'spelling';
                    setVoiceMode('spelling');
                    setVoiceInstruction(`🔤 Paso 2 de 3: Deletrea la letra 1 de ${wordLength} (${targetWord[0].toUpperCase()})...`);
                    setTimeout(() => {
                      setIsInitialWordCorrect(false);
                      startRecognitionForStage('spelling');
                    }, 800);
                    return;
                  } else {
                    triggerVoiceError();
                    return;
                  }
                } else if (currentStage === 'spelling') {
                  // Stage 2: Process and validate individual letters
                  const tokens = rawTranscript.split(/\s+/).filter(Boolean);
                  for (const tok of tokens) {
                    if (letterPointer >= wordLength) break;
                    const expectedLetter = targetWord[letterPointer];
                    const normalized = normalizeLetterToken(tok);

                    setSpellingLettersTranscript(prev => [...prev, tok.toUpperCase()]);

                    if (normalized === expectedLetter) {
                      const newIndex = letterPointer;
                      setCompletedLetterIndices(prev => [...prev, newIndex]);
                      playPositiveChime();
                      letterPointer++;

                      if (letterPointer === wordLength) {
                        currentStage = 'final_listen';
                        setVoiceMode('final_listen');
                        setVoiceInstruction(`🎤 Paso 3 de 3: ¡Muy bien! Pronuncia la palabra completa "${selectedWord.text.toUpperCase()}" nuevamente...`);
                        setTimeout(() => {
                          startRecognitionForStage('final_listen');
                        }, 800);
                        return;
                      } else {
                        const nextLetter = targetWord[letterPointer].toUpperCase();
                        setVoiceInstruction(`🔤 Paso 2 de 3: Deletrea la letra ${letterPointer + 1} de ${wordLength} (${nextLetter})...`);
                      }
                    } else {
                      triggerVoiceError();
                      return;
                    }
                  }
                } else if (currentStage === 'final_listen') {
                  // Stage 3: Evaluate ONLY the final complete word
                  setFinalWordTranscript(rawTranscript);
                  if (isWordMatch(cleanTranscript, targetWord)) {
                    playPositiveChime();
                    setIsFinalWordCorrect(true);
                    setVoiceMode('completed');
                    setVoiceInstruction('🎉 ¡Excelente trabajo! Verificación completa.');
                    stopAudioRecording();
                    try { rec.stop(); } catch (e) {}
                    setTimeout(() => {
                      setVoiceMode('idle');
                      setIsFinalWordCorrect(false);
                      setVoiceInstruction('');
                    }, 2500);
                    return;
                  } else {
                    triggerVoiceError();
                    return;
                  }
                }
              }
            };

            rec.onerror = () => {
              if (currentStage !== 'completed') {
                triggerVoiceError();
              }
            };

            try {
              rec.start();
            } catch (e) {
              triggerVoiceError();
            }
          };

          startRecognitionForStage('initial_listen');
        };

        const playRecordedAudio = (e) => {
          if (e) e.stopPropagation();
          if (!recordedAudioUrl) return;

          if (recordedAudioRef.current) {
            recordedAudioRef.current.pause();
          }

          const audio = new Audio(recordedAudioUrl);
          recordedAudioRef.current = audio;
          setIsPlayingRecording(true);
          audio.onended = () => setIsPlayingRecording(false);
          audio.onerror = () => setIsPlayingRecording(false);
          audio.play().catch(() => setIsPlayingRecording(false));
        };

        const playTick = useCallback(() => {
          if (isMuted) return;
          try {
            if (!audioCtxRef.current) {
              audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioCtxRef.current;
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            // Sintentiza un chasquido de lengüeta/clavija de ruleta de madera o plástico
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 + Math.random() * 80, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.012);

            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.012);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.012);
          } catch (e) {
            // Ignorar errores de audio context si no está permitido por interacciones
          }
        }, [isMuted]);
        const validWords = useMemo(() => words.filter(w => w.status !== WordStatus.FAILED && !removedWordIds.has(w.id)), [words, removedWordIds]);

        const validWordsRef = useRef(validWords);
        useEffect(() => {
          validWordsRef.current = validWords;
        }, [validWords]);

        const colors = useMemo(() => [
          '#F43F5E', '#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#06B6D4', '#6366F1'
        ], []);

        useEffect(() => {
          const updateSize = () => {
            const widthBound = window.innerWidth - 32;
            const heightBound = window.innerHeight - (window.innerWidth < 640 ? 160 : 130);
            const size = Math.min(widthBound, heightBound, 750);
            setCanvasSize(Math.max(size, 240));
          };
          updateSize();
          window.addEventListener('resize', updateSize);
          return () => window.removeEventListener('resize', updateSize);
        }, []);

        const drawWheel = useCallback(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const numSegments = validWords.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const radius = canvas.width / 2 - 25;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw segments
          validWords.forEach((word, index) => {
            const startAngle = currentAngleRef.current + index * segmentAngle;
            const endAngle = startAngle + segmentAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[index % colors.length];
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Word text and image illustration inside slice
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + segmentAngle / 2);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            const fontSize = Math.max(12, Math.floor(canvas.width / 28));
            ctx.font = `bold ${fontSize}px sans-serif`;

            // Dibujar imagen/icono en la ruleta si está cargada
            const loadedImg = loadedImagesRef.current[word.id];
            if (loadedImg) {
              const imgSize = Math.max(18, Math.floor(canvas.width / 16));
              ctx.drawImage(loadedImg, radius - 30 - imgSize, -imgSize / 2, imgSize, imgSize);
              ctx.fillText(word.text, radius - 38 - imgSize, fontSize / 3);
            } else {
              ctx.fillText(word.text, radius - 25, fontSize / 3);
            }
            ctx.shadowBlur = 0;

            ctx.restore();
          });

          // Draw Center Circle
          const centerRadius = Math.max(25, Math.floor(canvas.width * 0.08));
          ctx.beginPath();
          ctx.arc(centerX, centerY, centerRadius, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#333333';
          ctx.stroke();

          // Pointer
          ctx.beginPath();
          ctx.moveTo(centerX + radius + 18, centerY);
          ctx.lineTo(centerX + radius - 15, centerY - 15);
          ctx.lineTo(centerX + radius - 15, centerY + 15);
          ctx.closePath();
          ctx.fillStyle = '#e11d48';
          ctx.fill();
          ctx.stroke();
        }, [validWords, colors, canvasSize]);

        useEffect(() => {
          let isMounted = true;
          validWords.forEach(word => {
            if (word.imageUrl && !loadedImagesRef.current[word.id]) {
              const img = new Image();
              img.src = word.imageUrl;
              img.onload = () => {
                if (isMounted) {
                  loadedImagesRef.current[word.id] = img;
                  drawWheel();
                }
              };
            }
          });
          return () => { isMounted = false; };
        }, [validWords, drawWheel]);

        useEffect(() => {
          drawWheel();
        }, [drawWheel]);

        const spin = () => {
          const activeList = validWordsRef.current;
          if (isSpinning || activeList.length === 0) return;
          setIsSpinning(true);
          setShowCard(false);

          const randomSpins = 5 + Math.random() * 5;
          const targetDuration = 4000;
          const startTime = performance.now();
          const initialVelocity = (randomSpins * 2 * Math.PI) / 200;
          angularVelocityRef.current = initialVelocity;

          const numSegments = activeList.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            if (elapsed < targetDuration) {
              const progress = elapsed / targetDuration;
              const easeOut = 1 - Math.pow(1 - progress, 3);
              currentAngleRef.current += (1 - easeOut) * angularVelocityRef.current;
              
              // Emite sonido de tick cada vez que pasa por el borde de una sección
              const currentSegment = Math.floor(currentAngleRef.current / segmentAngle);
              if (currentSegment !== lastTickSegmentRef.current) {
                playTick();
                lastTickSegmentRef.current = currentSegment;
              }

              drawWheel();
              animationFrameRef.current = requestAnimationFrame(animate);
            } else {
              setIsSpinning(false);
              const currentValid = validWordsRef.current;
              const numSegments = currentValid.length;
              if (numSegments > 0) {
                const segmentAngle = (2 * Math.PI) / numSegments;
                const normalizedAngle = (2 * Math.PI - (currentAngleRef.current % (2 * Math.PI))) % (2 * Math.PI);
                const winningIndex = Math.floor(normalizedAngle / segmentAngle) % numSegments;
                const chosen = currentValid[winningIndex];
                setSelectedWord(chosen);
                setShowCard(true);
                if (chosen) {
                  // Automatically eliminate the selected word from the wheel pool
                  setRemovedWordIds(prev => new Set(prev).add(chosen.id));
                  playWordAudio(chosen.text);
                }
              }
            }
          };

          animationFrameRef.current = requestAnimationFrame(animate);
        };

        useEffect(() => {
          return () => cancelAnimationFrame(animationFrameRef.current);
        }, []);

        const handleContainerClick = () => {
          if (showCard) return;
          spin();
        };

        const playImageSound = () => {
          if (!selectedWord || isMuted) return;
          playWordAudio(selectedWord.text);
        };

        const playWordAudio = (wordText) => {
          if (isMuted) {
            return new Promise((resolve) => setTimeout(resolve, 500));
          }
          setIsSpeakingWholeWord(true);
          return new Promise((resolve) => {
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                setIsSpeakingWholeWord(false);
                resolve();
              }
            };
            if (selectedWord && selectedWord.audioUrl) {
              const audio = new Audio(selectedWord.audioUrl);
              audio.onended = done;
              audio.onerror = done;
              audio.play().catch(done);
              setTimeout(done, 3000);
            } else if (window.speechSynthesis) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(wordText);
              utterance.lang = 'en-US';
              utterance.rate = 0.8;
              utterance.onend = done;
              utterance.onerror = done;
              window.speechSynthesis.speak(utterance);
              setTimeout(done, 3000);
            } else {
              done();
            }
          });
        };

        const playLetterAudio = (letter) => {
          if (isMuted) {
            return new Promise((resolve) => setTimeout(resolve, 300));
          }
          return new Promise((resolve) => {
            if (!window.speechSynthesis) return setTimeout(resolve, 600);
            window.speechSynthesis.cancel();
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                resolve();
              }
            };
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.onend = done;
            utterance.onerror = done;
            window.speechSynthesis.speak(utterance);
            setTimeout(done, 1200);
          });
        };

        const handleSpellWordSequence = async (e) => {
          if (e) e.stopPropagation();
          if (isSpellingSequence || !selectedWord) return;
          setIsSpellingSequence(true);
          setActiveLetterIndex(-1);

          try {
            // 1. Pronounce the complete word
            await playWordAudio(selectedWord.text);

            // 2. Wait 900 milliseconds
            await new Promise(res => setTimeout(res, 900));

            // 3. Spell letter by letter, highlighting and scaling up each active letter
            const letters = selectedWord.text.split('');
            for (let i = 0; i < letters.length; i++) {
              const char = letters[i];
              setActiveLetterIndex(i);
              if (/[a-zA-Z0-9]/i.test(char)) {
                await playLetterAudio(char);
              } else {
                await new Promise(res => setTimeout(res, 400));
              }
            }
            setActiveLetterIndex(-1);

            // 4. Wait 900 milliseconds after completing all letters
            await new Promise(res => setTimeout(res, 900));

            // 5. Pronounce the complete word again
            await playWordAudio(selectedWord.text);
          } catch (err) {
            console.error('Spelling sequence error:', err);
          } finally {
            setActiveLetterIndex(-1);
            setIsSpellingSequence(false);
          }
        };

        return (
          <div 
            className="fixed inset-0 z-50 flex flex-col items-center justify-between p-2 sm:p-4 transition-colors duration-300 overflow-hidden" 
            style={{ 
              backgroundColor: isWhiteBg ? '#ffffff' : (background.startsWith('#') ? background : '#1f2937'),
              backgroundImage: (!isWhiteBg && !background.startsWith('#')) ? `url(${background})` : 'none',
              backgroundSize: 'cover',
              backgroundPosition: 'center'
            }}
          >
            {/* Header / Top Bar */}
            <div className="relative w-full flex justify-between items-center z-10 px-1 sm:px-2 pt-1">
              <div className="flex items-center z-10 flex-shrink-0">
                {logo ? (
                  <img src={logo} alt="Logo" className="h-8 sm:h-12 w-auto max-w-[100px] sm:max-w-[150px] object-contain" />
                ) : (
                  <div className="text-2xl sm:text-3xl">🐝</div>
                )}
              </div>

              {/* Title exactly centered relative to the wheel */}
              <div className="absolute left-1/2 -translate-x-1/2 top-0 pointer-events-none z-0 flex justify-center items-center w-auto">
                <h1 className={`font-bubble text-2xl xs:text-3xl sm:text-5xl md:text-6xl font-black tracking-wider sm:tracking-widest drop-shadow-md transition-colors duration-300 whitespace-nowrap ${isWhiteBg ? 'text-black' : 'text-white'}`}>
                  FOOTPRINTS
                </h1>
              </div>

              <div className="flex items-center sm:items-start space-x-1.5 sm:space-x-2 z-10 justify-end ml-auto flex-shrink-0">
                {removedWordIds.size > 0 && (
                  <button
                    onClick={() => setRemovedWordIds(new Set())}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] sm:text-xs font-bold px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl shadow transition"
                    title="Restablecer palabras en la ruleta"
                  >

      const App = () => {

              phonetic: COMMON_IPA[clean] || `/${clean}/`,
              sentence: COMMON_SENTENCES[clean] || `${wordText} is a great word for practice.`,
              imageUrl: PROFESSIONAL_WORD_IMAGES[clean] || createWordSvgIllustration(wordText),

              audioData: null,
              error: null,
            };
          });
        };

        const [words, setWords] = useState(createInitialWords);
        const [logo, setLogo] = useState(null);
        const [wheelBackground, setWheelBackground] = useState('#1f2937');
        const [isWhiteBg, setIsWhiteBg] = useState(false);
        const [isMuted, setIsMuted] = useState(false);
        const [hideLetters, setHideLetters] = useState(false);
        const [settings, setSettings] = useState({
          courseName: 'My Spelling Bee',
          voice: '',
          rate: 0.8,
          pitch: 1,
          generateImages: true,
          dictationMode: false,
        });
        const [voices, setVoices] = useState([]);
        const [toasts, setToasts] = useState([]);
        const [isGenerating, setIsGenerating] = useState(false);
        const [gameMode, setGameMode] = useState('wheel');
        const [wordForSpelling, setWordForSpelling] = useState(null);
        const [viewingImage, setViewingImage] = useState(null);

        const audioContextRef = useRef(null);
        const wordsRef = useRef([]);
        wordsRef.current = words;

        const addToast = useCallback((message, type = 'info') => {
          setToasts((prev) => [...prev, { id: generateUniqueId('toast'), message, type }]);
        }, []);

        const playSound = useCallback((type) => {
          if (isMuted) return;
          try {
            const ctx = audioContextRef.current || new (window.AudioContext || window.webkitAudioContext)();
            audioContextRef.current = ctx;
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'success') {
              osc.frequency.setValueAtTime(523.25, ctx.currentTime);
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            } else if (type === 'error') {
              osc.frequency.setValueAtTime(220, ctx.currentTime);
              osc.frequency.setValueAtTime(180, ctx.currentTime + 0.1);
            } else {
              osc.frequency.setValueAtTime(440, ctx.currentTime);
            }
            
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } catch (e) {
            // Audio context not allowed or supported
          }
        }, [isMuted]);

        useEffect(() => {
          const loadVoices = () => {
            if (typeof window !== 'undefined' && window.speechSynthesis) {
              const availableVoices = window.speechSynthesis.getVoices();
              if (availableVoices.length > 0) {
                // Filter exclusively English voices
                const englishVoices = availableVoices.filter(
                  v => v.lang && v.lang.toLowerCase().startsWith('en')
                );
                const voicesToUse = englishVoices.length > 0 ? englishVoices : availableVoices;
                setVoices(voicesToUse);
                
                // Set default voice to an English voice (preferably en-US)
                const defaultVoice = voicesToUse.find(v => v.lang === 'en-US' || v.lang === 'en_US') || voicesToUse[0];
                setSettings(prev => (prev.voice && voicesToUse.some(v => v.name === prev.voice)) ? prev : { ...prev, voice: defaultVoice ? defaultVoice.name : '' });
              }
            }
          };

          loadVoices();
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
          }
        }, []);

        const speakWord = useCallback((text, spell = false) => {
          if (isMuted || !window.speechSynthesis) return;
          window.speechSynthesis.cancel();
          let utterance;
          if (spell) {
            const spelled = text.toUpperCase().split('').join(', ') + '. ' + text + '.';
            utterance = new SpeechSynthesisUtterance(spelled);
          } else {
            utterance = new SpeechSynthesisUtterance(text);
          }
          utterance.lang = 'en-US';
          const match = voices.find(v => v.name === settings.voice);
          if (match) {
            utterance.voice = match;
          }
          utterance.rate = settings.rate;
          utterance.pitch = settings.pitch;
          window.speechSynthesis.speak(utterance);
        }, [voices, settings, isMuted]);

        const processWord = useCallback(async (wordId) => {
          setWords(prev => prev.map(w => w.id === wordId ? { ...w, status: WordStatus.PROCESSING } : w));
          const word = wordsRef.current.find(w => w.id === wordId);
          if (!word) return;

          try {
            const phoneticPromise = getPhonetic(word.text);
            const sentencePromise = settings.dictationMode ? getSentence(word.text) : Promise.resolve(null);
            const imagePromise = settings.generateImages || !word.imageUrl ? getImage(word.text) : Promise.resolve(word.imageUrl);

            const [phonetic, sentence, imageUrl] = await Promise.all([phoneticPromise, sentencePromise, imagePromise]);

            setWords(prev => prev.map(w => w.id === wordId ? {
              ...w,
              status: WordStatus.COMPLETED,
              phonetic,
              sentence,
              imageUrl,
              audioUrl: w.audioUrl || null,
              audioData: w.audioData || null,
              error: null,
            } : w));
          } catch (error) {
            console.error(error);
            setWords(prev => prev.map(w => w.id === wordId ? {
              ...w,
              status: WordStatus.FAILED,
              error: error.message || 'An unknown error occurred',
            } : w));
          }
        }, [settings.dictationMode, settings.generateImages]);

        const handleGenerate = async (wordIds) => {
          if (isGenerating) {
            addToast("A generation process is already running.", "info");
            return;
          }
          setIsGenerating(true);
          addToast(`Starting generation for ${wordIds.length} word(s)...`, "info");

          await Promise.all(wordIds.map(id => processWord(id)));
          setIsGenerating(false);

          setWords(currentWords => {
            const failedCount = currentWords.filter(w => wordIds.includes(w.id) && w.status === WordStatus.FAILED).length;
            if (failedCount > 0) {
              addToast(`${failedCount} word(s) failed to generate.`, "error");
              playSound('error');
            } else {
              addToast("All words generated successfully!", "success");
              playSound('success');
            }
            return currentWords;
          });
        };

        const handleAddWords = (newWords) => {
          const wordObjects = newWords
            .filter(w => w.trim() !== '')
            .map(w => ({
              id: generateUniqueId(w.trim()),
              text: w.trim(),
              status: WordStatus.PENDING,
              phonetic: null,
              sentence: null,
              imageUrl: null,
              audioUrl: null,
              audioData: null,
              error: null,
            }));
          setWords(prev => [...prev, ...wordObjects]);
          addToast(`${wordObjects.length} words added.`, 'success');
        };

        const handleFileLoad = async (file) => {
          try {
            addToast(`Parsing ${file.name}...`, 'info');
            if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
              const parsedWords = await parseDocx(file);
              handleAddWords(parsedWords);
            } else if (file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
              const parsedWords = await parseXlsx(file);
              handleAddWords(parsedWords);
            } else if (file.type === 'application/pdf') {
              const newWords = await parsePdf(file);
              setWords(prev => [...prev, ...newWords]);
              addToast(`${newWords.length} words and images added from PDF.`, 'success');
            } else if (file.type === 'application/zip') {
              const result = await parseZip(file, words.map(w => w.text));
              result.matched.forEach(({ text, audioBlob }) => {
                const audioUrl = URL.createObjectURL(audioBlob);
                setWords(prev => prev.map(w => w.text.toLowerCase() === text.toLowerCase() ? {
                  ...w,
                  audioUrl,
                  audioData: audioBlob,
                  status: WordStatus.COMPLETED,
                } : w));
              });
              addToast(`Matched ${result.matched.length} audio files from ZIP.`, 'success');
            }
          } catch (error) {
            addToast(`Failed to parse ${file.name}: ${error.message}`, 'error');
          }
        };

        const handleDownload = () => {
          downloadZip(words, settings.courseName);
          playSound('download');
          addToast(`Downloading ${settings.courseName}.zip`, 'success');
        };

        return (
          <div className="min-h-screen font-sans">
            <header className="bg-white dark:bg-gray-800 shadow-md p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3 sm:space-x-4">
                {logo ? (
                  <img src={logo} alt="Logo" className="h-8 sm:h-10 w-auto" />
                ) : (
                  <div className="text-xl sm:text-2xl font-black text-indigo-600">🐝</div>
                )}
                <div>
                  <h1 className="text-lg sm:text-xl font-bold text-gray-800 dark:text-white">{settings.courseName}</h1>
                  <h2 className="text-xs sm:text-sm font-semibold text-gray-500 dark:text-gray-400">Spelling Bee Helper</h2>
                </div>
              </div>
              <div className="flex items-center space-x-2 sm:space-x-3">
                <button
                  onClick={() => setIsWhiteBg(!isWhiteBg)}
                  className={`px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-bold shadow-sm transition border flex items-center space-x-1 sm:space-x-1.5 ${
                    isWhiteBg
                      ? 'bg-gray-800 text-white border-gray-600 hover:bg-gray-700'
                      : 'bg-white text-gray-800 border-gray-300 hover:bg-gray-100'
                  }`}
                  title="Cambiar color de fondo a blanco / oscuro"
                >
                  <span className={`w-2.5 h-2.5 rounded-full border ${isWhiteBg ? 'bg-gray-900 border-gray-300' : 'bg-white border-gray-400'}`}></span>
                  <span className="hidden xs:inline">{isWhiteBg ? 'Fondo Oscuro' : 'Fondo Blanco'}</span>
                  <span className="xs:hidden">{isWhiteBg ? 'Oscuro' : 'Blanco'}</span>
                </button>
                <button
                  onClick={() => setGameMode('wheel')}
                  disabled={words.filter(w => w.status !== WordStatus.FAILED).length === 0}
                  className="px-3 sm:px-4 py-1.5 sm:py-2 bg-green-500 text-white rounded-md font-semibold hover:bg-green-600 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center space-x-1 sm:space-x-2 text-xs sm:text-sm"
                >
                  <PlayIcon className="h-4 w-4 sm:h-5 sm:w-5" />
                  <span>Play Wheel</span>
                </button>
                <button
                  onClick={handleDownload}
                  disabled={words.filter(w => w.status === WordStatus.COMPLETED).length === 0}
                  className="px-3 sm:px-4 py-1.5 sm:py-2 bg-sky-500 text-white rounded-md font-semibold hover:bg-sky-600 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center space-x-1 sm:space-x-2 text-xs sm:text-sm"
                >
                  <DownloadIcon className="h-4 w-4 sm:h-5 sm:w-5" />
                  <span className="hidden xs:inline">Download ZIP</span>
                  <span className="xs:hidden">ZIP</span>
                </button>
              </div>
            </header>

            <div className="max-w-7xl mx-auto w-full">
              <MainContent
                words={words}
                onAddWords={handleAddWords}
                onFileLoad={handleFileLoad}
                onGenerate={handleGenerate}
                onDeleteWord={(id) => setWords(prev => prev.filter(w => w.id !== id))}
                onRegenerateWord={(id) => handleGenerate([id])}
                onOpenSpellingBee={(w) => {
                  setWordForSpelling(w);
                  setGameMode('spell');
                }}
                onImageClick={setViewingImage}
                onSpeak={speakWord}
                isGenerating={isGenerating}
              />
            </div>

            {gameMode === 'wheel' && (
              <SpinningWheel
                words={words}
                onClose={() => setGameMode(null)}
                background={wheelBackground}
                logo={logo}
                onOpenSpellingBee={(w) => {
                  setWordForSpelling(w);
                  setGameMode('spell');
                }}
                onSpeak={speakWord}
                isWhiteBg={isWhiteBg}
                setIsWhiteBg={setIsWhiteBg}
                isMuted={isMuted}
                setIsMuted={setIsMuted}
                hideLetters={hideLetters}
                setHideLetters={setHideLetters}
              />
            )}

            {gameMode === 'spell' && wordForSpelling && (
              <SpellingBee
                word={wordForSpelling}
                onClose={() => setGameMode(null)}
                onPronounce={(txt) => speakWord(txt, false)}
                onSpellOut={(txt) => speakWord(txt, true)}
              />
            )}

            {viewingImage && (
              <div
                className="fixed inset-0 z-50 bg-black bg-opacity-90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 cursor-pointer"
                onClick={() => setViewingImage(null)}
              >
                <div className="relative w-full h-full max-w-7xl max-h-[96vh] flex flex-col items-center justify-center" onClick={(e) => e.stopPropagation()}>
                  <h1 className="font-bubble text-3xl sm:text-5xl font-black tracking-widest text-white mb-3 drop-shadow-lg">
                    FOOTPRINTS
                  </h1>
                  {(typeof viewingImage === 'object' ? viewingImage.imageUrl : viewingImage) ? (
                    <img 
                      src={typeof viewingImage === 'object' ? viewingImage.imageUrl : viewingImage} 
                      alt="Word" 
                      onClick={() => {
                        const wordObj = typeof viewingImage === 'object' ? viewingImage : null;
                        if (wordObj && wordObj.audioUrl) {
                          const audio = new Audio(wordObj.audioUrl);
                          audio.play();
                        } else if (wordObj) {
                          speakWord(wordObj.text);
                        }
                      }}
                      className="w-full h-full max-w-full max-h-[85vh] sm:max-h-[90vh] rounded-2xl cursor-pointer hover:opacity-95 transition transform hover:scale-[1.01] object-contain" 
                      title="Presiona para escuchar"
                    />
                  ) : (
                    <div
                      onClick={() => {
                        const wordObj = typeof viewingImage === 'object' ? viewingImage : null;
                        if (wordObj && wordObj.audioUrl) {
                          const audio = new Audio(wordObj.audioUrl);
                          audio.play();
                        } else if (wordObj) {
                          speakWord(wordObj.text);
                        }
                      }}
                      className="bg-indigo-600 text-white font-black text-5xl sm:text-7xl px-16 py-20 rounded-3xl shadow-2xl cursor-pointer hover:scale-105 transition transform text-center max-w-3xl break-words"
                      title="Presiona para escuchar"
                    >
                      {typeof viewingImage === 'object' ? viewingImage.text : ''}
                    </div>
                  )}
                  {typeof viewingImage === 'object' && viewingImage.text && (
                    <p 
                      onClick={() => {
                        if (viewingImage.audioUrl) {
                          const audio = new Audio(viewingImage.audioUrl);
                          audio.play();
                        } else {
                          speakWord(viewingImage.text);
                        }
                      }}
                      className="text-white text-2xl font-bold mt-4 bg-black/60 px-6 py-2 rounded-full border border-white/20 cursor-pointer hover:underline"
                    >
                      🔊 {viewingImage.text}
                    </p>
                  )}
                  <button 
                    onClick={() => setViewingImage(null)}
                    className="absolute -top-12 right-0 text-white text-3xl font-bold p-2 hover:opacity-75"
                  >
                    ✕
                  </button>
                </div>
              </div>
            )}

            <Toast toasts={toasts} setToasts={setToasts} />
          </div>
        );
      };

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
